[project]
name = "kilter-grade-predictor"
version = "0.1.0"
description = "Predict Kilter Board climbing route difficulty from hold positions and board angle"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "boardlib>=0.10.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "joblib>=1.4",
    "mlflow>=2.18",
    "numpy>=2.0",
    "optuna>=4.0",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "pydantic>=2.10",
    "scikit-learn>=1.6",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "plotly>=5.18",
    "shap>=0.46,!=0.51.0",
    "streamlit>=1.40",
    "uvicorn>=0.32",
    "xgboost>=2.1",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29",
    "jupyter>=1.1",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
    "seaborn>=0.13",
]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
